<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b2a5b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="EMEEG Points">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="Check your EMEEG Customer Care points">
<title>EMEEG Points</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
  :root { --navy: #0b2a5b; --navy2: #14408f; --yellow: #f6c518; --bg: #eef1f6; --card: #fff; --muted: #5d6779; --line: #e3e7ee; --pos: #12804a; --neg: #c0392b; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: #111827; font-family: "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
  body { min-height: 100vh; padding-bottom: env(safe-area-inset-bottom); }
  .top { background: var(--navy); color: #fff; padding: calc(14px + env(safe-area-inset-top)) 18px 64px; position: relative; overflow: hidden; }
  .top:after { content: ""; position: absolute; left: -10%; right: -10%; bottom: -46px; height: 90px; background: var(--bg); border-radius: 50% 50% 0 0; }
  .top .row { display: flex; align-items: center; justify-content: space-between; position: relative; z-index: 1; }
  .top .brand { display: flex; align-items: center; gap: 10px; font-weight: 800; letter-spacing: .4px; }
  .top .brand img { height: 34px; }
  .top .brand small { display: block; font-weight: 600; font-size: 11px; color: #c9d6f0; letter-spacing: 2px; }
  .iconbtn { background: rgba(255,255,255,.12); color: #fff; border: 0; border-radius: 10px; padding: 8px 11px; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer; }
  main { max-width: 520px; margin: -54px auto 0; padding: 0 14px 30px; position: relative; z-index: 2; }
  .panel { background: var(--card); border-radius: 18px; padding: 18px; box-shadow: 0 8px 26px rgba(11,42,91,.10); margin-bottom: 14px; }
  h2 { font-size: 15px; margin: 0 0 10px; color: var(--navy); letter-spacing: .3px; }
  label { display: block; font-size: 13px; font-weight: 700; color: var(--navy); margin: 12px 0 5px; }
  input { width: 100%; font: inherit; font-size: 17px; padding: 13px 14px; border: 1.5px solid #cdd4e0; border-radius: 12px; background: #fff; color: #111; }
  input:focus { outline: none; border-color: var(--navy2); box-shadow: 0 0 0 3px rgba(20,64,143,.15); }
  input.pin { letter-spacing: 10px; font-size: 24px; text-align: center; font-family: Consolas, "Courier New", monospace; }
  .btn { display: block; width: 100%; margin-top: 16px; padding: 14px; font: inherit; font-size: 16px; font-weight: 800; border: 0; border-radius: 12px; background: var(--navy); color: #fff; cursor: pointer; }
  .btn:disabled { opacity: .6; }
  .btn.yellow { background: var(--yellow); color: var(--navy); }
  .muted { color: var(--muted); font-size: 13px; }
  .err { background: #fdecea; color: #8c1d12; border-radius: 12px; padding: 11px 13px; font-size: 14px; margin-top: 12px; }
  .note { background: #fff7db; color: #6b4a00; border-radius: 12px; padding: 10px 12px; font-size: 13px; margin-bottom: 12px; }
  .hello { font-size: 14px; color: var(--muted); }
  .bal { text-align: center; padding: 6px 0 2px; }
  .bal .n { font-size: 56px; font-weight: 900; color: var(--navy); line-height: 1; letter-spacing: -1px; }
  .bal .n small { font-size: 18px; font-weight: 700; letter-spacing: 0; }
  .bal .v { font-size: 17px; font-weight: 700; margin-top: 6px; }
  .bal .v b { color: var(--pos); }
  .mini { margin-top: 14px; border-radius: 14px; padding: 13px 15px; background: var(--navy); color: #fff; position: relative; overflow: hidden; }
  .mini:after { content: ""; position: absolute; right: -28px; top: -20px; width: 90px; height: 140%; background: var(--yellow); transform: rotate(18deg); opacity: .95; }
  .mini > * { position: relative; z-index: 1; padding-right: 54px; }
  .mini .nm { font-weight: 800; font-size: 16px; }
  .mini .no { font-family: Consolas, "Courier New", monospace; font-size: 13px; color: var(--yellow); letter-spacing: .5px; margin-top: 3px; word-break: break-all; }
  .mini .ex { font-size: 12px; color: #c9d6f0; margin-top: 4px; }
  .mini .badge { background: #fff; }
  .badge { display: inline-block; font-size: 11px; font-weight: 800; padding: 2px 8px; border-radius: 10px; background: #fdecea; color: var(--neg); }
  .rule { text-align: center; font-size: 13px; color: var(--muted); margin-top: 10px; }
  .upd { text-align: center; font-size: 12px; color: var(--muted); margin: -4px 0 12px; }
  .news { border-left: 4px solid var(--yellow); padding: 6px 0 6px 12px; margin-bottom: 10px; }
  .news b { display: block; color: var(--navy); }
  .news p { margin: 3px 0 0; font-size: 14px; white-space: pre-wrap; }
  .news small { color: var(--muted); font-size: 11.5px; }
  .tix { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .tix span { font-family: Consolas, "Courier New", monospace; font-size: 13px; font-weight: 700; background: #fff7db; border: 1px dashed #d9a800; color: #5a4300; border-radius: 8px; padding: 5px 8px; }
  .hist { list-style: none; margin: 0; padding: 0; }
  .hist li { display: flex; justify-content: space-between; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); }
  .hist li:last-child { border-bottom: 0; }
  .hist .t { font-weight: 700; font-size: 14px; }
  .hist .d { font-size: 12px; color: var(--muted); }
  .hist .p { font-weight: 800; white-space: nowrap; }
  .pos { color: var(--pos); } .neg { color: var(--neg); }
  .install { display: none; }
  .install.show { display: block; }
  .center { text-align: center; }
  .logo-big { display: block; width: 70%; max-width: 260px; margin: 4px auto 6px; }
  .link { background: none; border: 0; color: var(--navy2); font: inherit; font-size: 14px; font-weight: 600; text-decoration: underline; cursor: pointer; padding: 6px; }
  .acts { display: flex; gap: 8px; margin-top: 12px; }
  .acts button { flex: 1; padding: 11px 8px; font: inherit; font-size: 14px; font-weight: 700; border-radius: 12px; border: 1.5px solid #cdd4e0; background: #fff; color: var(--navy); cursor: pointer; }
  .acts button.on { background: var(--navy); color: #fff; border-color: var(--navy); }
  .acts .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--yellow); margin-left: 4px; vertical-align: 1px; }
  .prof { display: grid; grid-template-columns: 26px 1fr; gap: 6px 8px; font-size: 15px; }
  .prof .k { color: var(--muted); font-size: 12px; }
  .ok { background: #e7f6ec; color: #17633a; border-radius: 12px; padding: 10px 12px; font-size: 14px; margin-top: 12px; }
  .row2 { display: flex; gap: 10px; } .row2 > div { flex: 1; }
  .btn.ghost { background: #fff; color: var(--navy); border: 1.5px solid #cdd4e0; }
  .spin { display: inline-block; width: 16px; height: 16px; border: 2px solid rgba(255,255,255,.4); border-top-color: #fff; border-radius: 50%; animation: s 0.8s linear infinite; vertical-align: -3px; }
  @keyframes s { to { transform: rotate(360deg); } }
  .scanbtn { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; margin-top: 14px; padding: 15px; font: inherit; font-size: 17px; font-weight: 800; border: 0; border-radius: 14px; background: var(--yellow); color: var(--navy); cursor: pointer; box-shadow: 0 4px 0 #d9a800; }
  .scanbtn svg { width: 26px; height: 26px; }
  .or { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 12px; margin: 16px 0 2px; }
  .or:before, .or:after { content: ""; flex: 1; height: 1px; background: var(--line); }
  .scanned { display: flex; align-items: center; gap: 10px; background: #e7f6ec; border: 1.5px solid #9fd8b4; border-radius: 12px; padding: 11px 13px; margin-top: 14px; }
  .scanned .ic { font-size: 22px; }
  .scanned b { display: block; color: #17633a; font-size: 16px; word-break: break-word; }
  .scanned small { color: var(--muted); font-size: 12px; }
  .cam { position: fixed; inset: 0; z-index: 50; background: #000; display: flex; flex-direction: column; }
  .cam video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .cam .frame { position: absolute; left: 50%; top: 45%; width: min(68vw, 300px); aspect-ratio: 1; transform: translate(-50%, -50%); border-radius: 22px; box-shadow: 0 0 0 9999px rgba(0,0,0,.55); border: 3px solid var(--yellow); }
  .cam .frame:after { content: ""; position: absolute; left: 8%; right: 8%; height: 3px; background: var(--yellow); top: 10%; border-radius: 3px; animation: scanline 1.8s ease-in-out infinite alternate; box-shadow: 0 0 12px var(--yellow); }
  @keyframes scanline { to { top: 88%; } }
  .cam .msg { position: absolute; left: 0; right: 0; top: calc(20px + env(safe-area-inset-top)); text-align: center; color: #fff; font-weight: 700; font-size: 16px; padding: 0 20px; text-shadow: 0 1px 4px #000; }
  .cam .msg small { display: block; font-weight: 500; font-size: 13px; color: #dfe6f3; margin-top: 4px; }
  .cam .bar { position: absolute; left: 0; right: 0; bottom: calc(24px + env(safe-area-inset-bottom)); display: flex; justify-content: center; gap: 12px; padding: 0 20px; }
  .cam .bar button { flex: 1; max-width: 220px; padding: 14px; font: inherit; font-size: 16px; font-weight: 800; border: 0; border-radius: 14px; background: #fff; color: var(--navy); cursor: pointer; }
  .cam .bar button.torch { flex: 0 0 auto; width: 56px; background: rgba(255,255,255,.18); color: #fff; }
  .cam .bar button.torch.on { background: var(--yellow); color: var(--navy); }
</style>
</head>
<body>
<div class="top">
  <div class="row">
    <div class="brand"><img src="icons/icon-192.png" alt=""><div>EMEEG<small>CUSTOMER CARE</small></div></div>
    <button class="iconbtn" id="refreshBtn" onclick="refresh(true)" style="display:none">↻ Refresh</button>
  </div>
</div>
<main id="app"></main>

<script src="config.js"></script>
<script>
const CFG = window.EMEEG_APP || {};
const $app = document.getElementById('app');
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const num = (n) => Number(n || 0).toLocaleString('en-PH');
const peso = (n) => '₱' + Number(n || 0).toLocaleString('en-PH', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const store = { get(k) { try { return JSON.parse(localStorage.getItem('emeeg_' + k)); } catch { return null; } },
  set(k, v) { try { localStorage.setItem('emeeg_' + k, JSON.stringify(v)); } catch {} }, del(k) { try { localStorage.removeItem('emeeg_' + k); } catch {} } };

function normCard(v) {
  let s = String(v || '').toUpperCase().replace(/\s+/g, '').trim();
  const m = s.match(/^([A-Z]+)-?(\d{8})-?([A-Z0-9]{6})$/);
  return m ? `${m[1]}-${m[2]}-${m[3]}` : s;
}
function fmtDate(d) {
  if (!d) return '';
  const [y, m, day] = String(d).slice(0, 10).split('-').map(Number);
  return new Date(y, m - 1, day).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
}
function ago(iso) {
  if (!iso) return '';
  const s = Math.max(0, (Date.now() - new Date(iso).getTime()) / 1000);
  if (s < 90) return 'just now';
  if (s < 3600) return Math.round(s / 60) + ' minutes ago';
  if (s < 86400) return Math.round(s / 3600) + ' hour' + (s < 5400 ? '' : 's') + ' ago';
  return new Date(iso).toLocaleString('en-US', { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
}
async function rpc(fn, body) {
  const url = String(CFG.supabaseUrl || '').trim().replace(/\/+$/, '').replace(/\/rest\/v1$/i, '').replace(/\/+$/, '');
  const headers = { 'Content-Type': 'application/json', apikey: CFG.supabaseKey };
  if (/^eyJ/.test(CFG.supabaseKey || '')) headers.Authorization = 'Bearer ' + CFG.supabaseKey;
  const r = await fetch(`${url}/rest/v1/rpc/${fn}`, { method: 'POST', headers, body: JSON.stringify(body || {}) });
  const j = await r.json().catch(() => null);
  if (!r.ok) throw new Error((j && (j.message || j.hint)) || 'Server error ' + r.status);
  return j;
}

// ---------------------------------------------------------------- login
const CAM_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2"/><rect x="7" y="7" width="4" height="4"/><rect x="13" y="7" width="4" height="4"/><rect x="7" y="13" width="4" height="4"/><path d="M13 13h4v4"/></svg>';
let scanName = null;            // name read from the QR on the EMEEG card (the card QR holds the customer's name)
const CARD_RE = /^[A-Z]+-\d{8}-[A-Z0-9]{6}$/;

function showLogin(msg, cardValue) {
  document.getElementById('refreshBtn').style.display = 'none';
  const q = new URLSearchParams(location.search).get('card');
  const card = cardValue || q || (store.get('login') || {}).card || '';
  const canScan = !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia);
  $app.innerHTML = `
  <div class="panel">
    <img class="logo-big" src="img/logo.png" alt="EMEEG">
    <h2 class="center" style="font-size:20px;margin:6px 0 2px">Check your points</h2>
    <div class="muted center">${scanName ? 'Now type your PIN.' : canScan ? 'Scan the QR code on your EMEEG card, then type your PIN.' : 'Use the card number and PIN on your EMEEG app slip.'}</div>
    <form id="loginForm" autocomplete="on">
      ${scanName ? `
        <div class="scanned"><span class="ic">✅</span><div style="flex:1"><small>Card scanned</small><b>${esc(scanName)}</b></div></div>
        <div class="center"><button type="button" class="link" id="rescanBtn">Scan again</button> · <button type="button" class="link" id="typeBtn">Type card number</button></div>
      ` : `
        ${canScan ? `<button type="button" class="scanbtn" id="scanBtn">${CAM_ICON} Scan my EMEEG card</button><div class="or">or type your card number</div>` : ''}
        <label for="card">Card number</label>
        <input id="card" name="card" autocomplete="username" autocapitalize="characters" placeholder="EMEEG-20261004-ABC123" value="${esc(card)}">
      `}
      <label for="pin">PIN (4 digits)</label>
      <input id="pin" name="pin" class="pin" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="current-password" placeholder="••••">
      ${msg ? `<div class="err">${msg}</div>` : ''}
      <button class="btn" id="loginBtn" type="submit">Show my points</button>
      <div class="muted center" style="margin-top:12px">No PIN yet, or forgot it? Ask at the EMEEG counter.</div>
    </form>
  </div>
  ${installBox()}`;
  document.getElementById('loginForm').addEventListener('submit', (e) => { e.preventDefault(); doLogin(); });
  const on = (id, fn) => { const el = document.getElementById(id); if (el) el.addEventListener('click', fn); };
  on('scanBtn', startScan);
  on('rescanBtn', startScan);
  on('typeBtn', () => { scanName = null; showLogin('', ''); });
  setTimeout(() => { const el = document.getElementById(scanName || card ? 'pin' : 'card'); if (el && (scanName || card || !canScan)) el.focus(); }, 50);
  bindInstall();
}

// ---------------------------------------------------------------- scan the card (camera)
let cam = null;
function loadJsQR() {
  if (window.jsQR) return Promise.resolve();
  return new Promise((ok, bad) => { const s = document.createElement('script'); s.src = 'jsQR.js'; s.onload = ok; s.onerror = bad; document.head.appendChild(s); });
}
async function startScan() {
  stopScan();
  const box = document.createElement('div');
  box.className = 'cam';
  box.innerHTML = `<video playsinline muted autoplay></video><div class="frame"></div>
    <div class="msg">Point the camera at the QR code on your card<small>Hold it steady inside the yellow box</small></div>
    <div class="bar"><button type="button" class="torch" id="torchBtn" style="display:none" aria-label="Flashlight">🔦</button><button type="button" id="camCancel">Cancel</button></div>`;
  document.body.appendChild(box);
  const video = box.querySelector('video');
  cam = { box, stream: null, timer: 0, done: false };
  box.querySelector('#camCancel').onclick = () => stopScan();
  try {
    cam.stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false });
  } catch (e) {
    stopScan();
    const denied = e && (e.name === 'NotAllowedError' || e.name === 'SecurityError');
    return showLogin(denied ? 'The camera is not allowed. Allow the camera for this app in your phone settings, or type your card number.' : 'Cannot open the camera. Please type your card number.', '');
  }
  if (!cam) { return; }
  video.srcObject = cam.stream;
  try { await video.play(); } catch {}
  // flashlight (Android)
  try {
    const track = cam.stream.getVideoTracks()[0];
    if (track && track.getCapabilities && track.getCapabilities().torch) {
      const tb = box.querySelector('#torchBtn'); tb.style.display = ''; let lit = false;
      tb.onclick = () => { lit = !lit; track.applyConstraints({ advanced: [{ torch: lit }] }).catch(() => {}); tb.classList.toggle('on', lit); };
    }
  } catch {}
  let detector = null;
  try { if ('BarcodeDetector' in window && (await BarcodeDetector.getSupportedFormats()).includes('qr_code')) detector = new BarcodeDetector({ formats: ['qr_code'] }); } catch {}
  if (!detector) { try { await loadJsQR(); } catch { stopScan(); return showLogin('Cannot start the scanner. Please type your card number.', ''); } }
  const canvas = document.createElement('canvas'); const ctx = canvas.getContext('2d', { willReadFrequently: true });
  const tick = async () => {
    if (!cam || cam.done) return;
    let text = null;
    try {
      if (video.readyState >= 2 && video.videoWidth) {
        if (detector) {
          const codes = await detector.detect(video);
          if (codes && codes.length) text = codes[0].rawValue;
        } else {
          // read the middle part of the picture, made smaller (faster on cheap phones)
          const vw = video.videoWidth, vh = video.videoHeight, side = Math.min(vw, vh) * 0.8;
          const size = Math.min(640, Math.round(side));
          canvas.width = size; canvas.height = size;
          ctx.drawImage(video, (vw - side) / 2, (vh - side) / 2, side, side, 0, 0, size, size);
          const img = ctx.getImageData(0, 0, size, size);
          const code = window.jsQR(img.data, size, size, { inversionAttempts: 'attemptBoth' });
          if (code && code.data) text = code.data;
        }
      }
    } catch {}
    if (text && text.trim()) return gotScan(text.trim());
    if (cam) cam.timer = setTimeout(tick, detector ? 150 : 120);
  };
  tick();
}
function stopScan() {
  if (!cam) return;
  cam.done = true; clearTimeout(cam.timer);
  try { cam.stream && cam.stream.getTracks().forEach((t) => t.stop()); } catch {}
  cam.box.remove(); cam = null;
}
function gotScan(text) {
  stopScan();
  try { if (navigator.vibrate) navigator.vibrate(60); } catch {}
  // 1) the app slip QR: a link with ?card=   2) a card number   3) the EMEEG card QR: the customer's name
  let card = null;
  try { const u = new URL(text); const c = u.searchParams.get('card'); if (c) card = normCard(c); } catch {}
  if (!card && CARD_RE.test(normCard(text))) card = normCard(text);
  if (card) { scanName = null; return showLogin('', card); }
  if (/^https?:\/\//i.test(text)) return showLogin('That QR code is not an EMEEG card. Please scan the QR code on your EMEEG card.', '');
  scanName = text.replace(/\s+/g, ' ').slice(0, 120);
  showLogin('', '');
}

async function doLogin() {
  const pin = document.getElementById('pin').value.trim();
  const byName = !!scanName;
  const card = byName ? '' : normCard(document.getElementById('card').value);
  if (!pin || (!byName && !card)) return showLogin(byName ? 'Type your PIN.' : 'Type your card number and PIN, or scan your card.', card);
  const btn = document.getElementById('loginBtn'); btn.disabled = true; btn.innerHTML = '<span class="spin"></span> Checking…';
  try {
    const r = byName ? await rpc('customer_login_scan', { p_name: scanName, p_pin: pin }) : await rpc('customer_login', { p_card: card, p_pin: pin });
    if (r && r.locked) return showLogin(`Too many wrong PINs. Please try again in ${r.minutes} minute${r.minutes == 1 ? '' : 's'}.`, card);
    if (r && r.many) { scanName = null; return showLogin('More than one card has this name. Please type your card number from your app slip.', ''); }
    if (!r || !r.ok) return showLogin(byName ? 'The PIN is not correct for this card. Check your app slip, or ask at the counter.' : 'Card number or PIN is not correct. Check your app slip, or ask at the counter.', card);
    const cardNo = normCard((r.card && r.card.card_number) || card);
    scanName = null;
    store.set('login', { card: cardNo, pin });
    store.set('last', { at: new Date().toISOString(), data: r });
    showPoints(r, false);
    loadNews();
  } catch (e) {
    showLogin(e && /function|schema cache|404/i.test(e.message || '') && byName
      ? 'Scanning is not ready yet at the store. Please type your card number for now.'
      : 'Cannot connect right now. Check your internet and try again.', card);
  }
}
function logout() {
  if (!confirm('Log out from this phone?')) return;
  store.del('login'); store.del('last'); store.del('news');
  scanName = null;
  showLogin('', '');
}

// ---------------------------------------------------------------- points screen
let CUR = null, OPEN_BOX = null;
function showPoints(r, offline) {
  CUR = r;
  document.getElementById('refreshBtn').style.display = 'inline-block';
  const c = r.card || {};
  const last = r.store && r.store.last_sync;
  const raffles = (c.raffles || []);
  const hist = (c.history || []);
  $app.innerHTML = `
  ${offline ? `<div class="note">You are offline. These are your saved points from ${esc(ago(offline))}.</div>` : ''}
  <div class="panel">
    <div class="hello">Hello, <b>${esc(c.name || '')}</b></div>
    <div class="bal">
      <div class="n">${num(c.balance)} <small>points</small></div>
      <div class="v">worth <b>${peso(c.value)}</b></div>
    </div>
    <div class="rule">Earn 1 point for every ${peso(c.peso_per_point || 100).replace('.00', '')} you spend · 1 point = ${peso(c.point_value || 1)}</div>
    <div class="mini">
      <div class="nm">${esc(c.name || '')}</div>
      <div class="no">${esc(c.card_number || '')}</div>
      <div class="ex">${c.expires_at ? (c.expired ? '<span class="badge">EXPIRED</span> ' : 'Valid until ') + esc(fmtDate(c.expires_at)) : 'No expiry'}</div>
    </div>
    ${c.expired ? '<div class="err">Your card has expired. Renew it at the EMEEG counter to keep earning points.</div>' : ''}
    <div class="acts">
      <button id="btnProfile" onclick="toggleBox('profile')">👤 My profile${r.profile && (r.profile.birthday || r.profile.barangay) ? '' : '<span class="dot"></span>'}</button>
      <button id="btnPin" onclick="toggleBox('pin')">🔑 Change PIN</button>
    </div>
  </div>
  <div id="sideBox"></div>
  ${last ? `<div class="upd">Points updated ${esc(ago(last))}</div>` : ''}
  <div id="newsBox">${newsHtml(store.get('news') || [])}</div>
  ${raffles.map((f) => `<div class="panel"><h2>🎟️ ${esc(f.name)}</h2>
      <div class="muted">${f.tickets.length ? `You have <b>${f.tickets.length}</b> raffle ticket${f.tickets.length === 1 ? '' : 's'}.` : 'No tickets yet.'}
        Every ${peso(f.per_entry).replace('.00', '')} on one receipt = 1 ticket. Draw: <b>${esc(fmtDate(f.draw))}</b></div>
      ${f.tickets.length ? `<div class="tix">${f.tickets.map((t) => `<span>${esc(t)}</span>`).join('')}</div>` : ''}</div>`).join('')}
  <div class="panel"><h2>Points history</h2>
    ${hist.length ? `<ul class="hist">${hist.map((h) => `<li><div><div class="t">${esc(h.label)}</div>
      <div class="d">${esc(fmtDate(h.date))}${h.receipt ? ' · Receipt ' + esc(h.receipt) : ''}</div></div>
      <div class="p ${h.points >= 0 ? 'pos' : 'neg'}">${h.points >= 0 ? '+' : ''}${num(h.points)}</div></li>`).join('')}</ul>` : '<div class="muted">No points yet. Show your card when you buy at EMEEG.</div>'}
  </div>
  ${installBox()}
  <div class="center"><button class="link" onclick="logout()">Not you? Log out</button></div>`;
  bindInstall();
  if (OPEN_BOX) renderBox(OPEN_BOX);
}

// ---------------------------------------------------------------- my profile / change PIN
function toggleBox(which) { OPEN_BOX = OPEN_BOX === which ? null : which; renderBox(OPEN_BOX); }
function renderBox(which, msg) {
  const box = document.getElementById('sideBox');
  if (!box) return;
  document.getElementById('btnProfile').classList.toggle('on', which === 'profile' || which === 'profileEdit');
  document.getElementById('btnPin').classList.toggle('on', which === 'pin');
  const p = (CUR && CUR.profile) || {};
  const today = new Date(); const max = today.toISOString().slice(0, 10);
  if (!which) { box.innerHTML = ''; return; }
  if (which === 'profile') {
    const empty = !p.birthday && !p.barangay && !p.address;
    box.innerHTML = `<div class="panel"><h2>👤 My profile</h2>
      ${empty ? '<div class="muted">Tell us your birthday and where you live. It helps EMEEG serve you better.</div>' : `<div class="prof">
        <div>🎂</div><div><div class="k">Birthday</div>${p.birthday ? esc(fmtDate(p.birthday)) : '<span class="muted">not set</span>'}</div>
        <div>📍</div><div><div class="k">Barangay</div>${p.barangay ? esc(p.barangay) : '<span class="muted">not set</span>'}</div>
        <div>🏠</div><div><div class="k">Address (purok / street)</div>${p.address ? esc(p.address) : '<span class="muted">not set</span>'}</div></div>`}
      ${msg ? `<div class="ok">${msg}</div>` : ''}
      <button class="btn" onclick="renderBox('profileEdit')">${empty ? 'Fill in my profile' : 'Edit profile'}</button></div>`;
  } else if (which === 'profileEdit') {
    box.innerHTML = `<div class="panel"><h2>👤 Edit my profile</h2>
      <form id="profForm">
        <label for="pfBirthday">Birthday</label><input id="pfBirthday" type="date" max="${max}" min="1900-01-01" value="${esc(p.birthday || '')}">
        <label for="pfBarangay">Barangay</label><input id="pfBarangay" maxlength="80" autocomplete="address-level3" placeholder="e.g. Peñaplata" value="${esc(p.barangay || '')}">
        <label for="pfAddress">Address (purok / street)</label><input id="pfAddress" maxlength="200" autocomplete="street-address" placeholder="e.g. Purok 3, near the chapel" value="${esc(p.address || '')}">
        ${msg ? `<div class="err">${msg}</div>` : ''}
        <div class="row2"><div><button type="button" class="btn ghost" onclick="renderBox('profile')">Cancel</button></div>
          <div><button class="btn" id="pfSave" type="submit">Save</button></div></div>
      </form></div>`;
    document.getElementById('profForm').addEventListener('submit', (e) => { e.preventDefault(); saveProfile(); });
  } else if (which === 'pin') {
    box.innerHTML = `<div class="panel"><h2>🔑 Change my PIN</h2>
      <div class="muted">Choose 4 numbers that are easy for you to remember, but hard for others to guess (not 1234 or your birthday).</div>
      <form id="pinForm">
        <label for="pnOld">Current PIN</label><input id="pnOld" class="pin" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="current-password">
        <label for="pnNew">New PIN</label><input id="pnNew" class="pin" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="new-password">
        <label for="pnNew2">New PIN again</label><input id="pnNew2" class="pin" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="new-password">
        ${msg ? `<div class="${msg.ok ? 'ok' : 'err'}">${msg.text}</div>` : ''}
        <button class="btn" id="pnSave" type="submit">Change PIN</button>
      </form></div>`;
    document.getElementById('pinForm').addEventListener('submit', (e) => { e.preventDefault(); changePin(); });
  }
}
async function saveProfile() {
  const login = store.get('login'); if (!login) return;
  const birthday = document.getElementById('pfBirthday').value || null;
  const barangay = document.getElementById('pfBarangay').value.trim();
  const address = document.getElementById('pfAddress').value.trim();
  const btn = document.getElementById('pfSave'); btn.disabled = true; btn.innerHTML = '<span class="spin"></span>';
  try {
    const r = await rpc('customer_save_profile', { p_card: login.card, p_pin: login.pin, p_birthday: birthday, p_barangay: barangay, p_address: address });
    if (r && r.ok) {
      CUR.profile = { birthday, barangay, address };
      const last = store.get('last'); if (last) { last.data.profile = CUR.profile; store.set('last', last); }
      showPoints(CUR, false); OPEN_BOX = 'profile'; renderBox('profile', 'Saved. Thank you!');
    } else if (r && r.error) renderBox('profileEdit', esc(r.error));
    else { store.del('login'); showLogin('Please log in again.', login.card); }
  } catch { renderBox('profileEdit', 'Cannot connect right now. Check your internet and try again.'); }
}
async function changePin() {
  const login = store.get('login'); if (!login) return;
  const old = document.getElementById('pnOld').value.trim(), n1 = document.getElementById('pnNew').value.trim(), n2 = document.getElementById('pnNew2').value.trim();
  if (!/^\d{4}$/.test(n1)) return renderBox('pin', { text: 'The new PIN must be 4 numbers.' });
  if (n1 !== n2) return renderBox('pin', { text: 'The two new PINs are not the same.' });
  if (n1 === old) return renderBox('pin', { text: 'The new PIN is the same as the current one.' });
  if (['1234', '0000', '1111', '4321'].includes(n1)) return renderBox('pin', { text: 'That PIN is too easy to guess. Please choose another one.' });
  const btn = document.getElementById('pnSave'); btn.disabled = true; btn.innerHTML = '<span class="spin"></span> Saving…';
  try {
    const r = await rpc('customer_change_pin', { p_card: login.card, p_pin: old, p_new_pin: n1 });
    if (r && r.ok) { store.set('login', { card: login.card, pin: n1 }); renderBox('pin', { ok: true, text: 'Your PIN is changed. Use the new PIN next time.' }); }
    else if (r && r.locked) renderBox('pin', { text: `Too many wrong PINs. Please try again in ${r.minutes} minute${r.minutes == 1 ? '' : 's'}.` });
    else if (r && r.error) renderBox('pin', { text: esc(r.error) });
    else renderBox('pin', { text: 'The current PIN is not correct.' });
  } catch { renderBox('pin', { text: 'Cannot connect right now. Check your internet and try again.' }); }
}
function newsHtml(list) {
  if (!list || !list.length) return '';
  return `<div class="panel"><h2>📣 News from ${esc(CFG.storeName || 'EMEEG')}</h2>${list.map((n) => `<div class="news">
    <b>${esc(n.title)}</b>${n.body ? `<p>${esc(n.body)}</p>` : ''}<small>${esc(fmtDate(n.created_at))}</small></div>`).join('')}</div>`;
}
async function loadNews() {
  try {
    const list = await rpc('customer_news', {});
    store.set('news', list || []);
    const box = document.getElementById('newsBox');
    if (box) box.innerHTML = newsHtml(list);
  } catch {}
}
let busy = false;
async function refresh(manual) {
  const login = store.get('login');
  if (!login || busy) return;
  busy = true;
  const btn = document.getElementById('refreshBtn');
  if (manual) btn.innerHTML = '<span class="spin"></span>';
  try {
    const r = await rpc('customer_login', { p_card: login.card, p_pin: login.pin });
    if (r && r.ok) {
      store.set('last', { at: new Date().toISOString(), data: r });
      if (OPEN_BOX === 'profileEdit' || OPEN_BOX === 'pin') { CUR = { ...r, profile: CUR ? CUR.profile : r.profile }; return; }   // don't wipe what they are typing
      showPoints(r, false); loadNews();
    }
    else if (r && !r.locked) { store.del('login'); store.del('last'); showLogin('Your PIN was changed. Please log in with your new PIN.', login.card); }
  } catch {
    const last = store.get('last');
    if (last && manual) showPoints(last.data, last.at);
  } finally { busy = false; btn.innerHTML = '↻ Refresh'; }
}

// ---------------------------------------------------------------- install on phone
let installEvent = null;
const UA = navigator.userAgent || '';
const isStandalone = () => window.matchMedia('(display-mode: standalone)').matches || navigator.standalone;
const isIOS = () => /iphone|ipad|ipod/i.test(UA) || (/Macintosh/.test(UA) && navigator.maxTouchPoints > 1);
const isAndroid = () => /android/i.test(UA);
// Facebook, Messenger, Instagram, TikTok... open links in their own small browser that cannot install apps
const inAppBrowser = () => /FBAN|FBAV|FB_IAB|FBIOS|Messenger|Orca-Android|Instagram|Line\/|TikTok|musical_ly|BytedanceWebview|Snapchat|Twitter/i.test(UA);
// once the app was opened from its icon, the browser on the same phone knows it is installed
if (isStandalone()) store.set('installed', true);
window.addEventListener('appinstalled', () => { store.set('installed', true); installEvent = null; updateInstallBox(); });
window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); installEvent = e; store.del('installed'); updateInstallBox(); });

function installHelp() {
  const link = location.origin + location.pathname;
  const copyBtn = `<button class="btn ghost" data-copylink="${esc(link)}" style="margin-top:10px">📋 Copy the app link</button>`;
  if (inAppBrowser()) {
    const where = /Messenger|Orca-Android|MessengerLite/i.test(UA) ? 'Messenger' : /Instagram/i.test(UA) ? 'Instagram' : /TikTok|musical_ly|Bytedance/i.test(UA) ? 'TikTok' : 'Facebook';
    return `<div class="muted">You opened this inside <b>${where}</b>, which cannot install apps.
      Tap the <b>⋮</b> or <b>•••</b> menu at the top, then <b>${isIOS() ? 'Open in Safari' : 'Open in Chrome'}</b> (or "Open in browser"). Then install it from there.</div>${copyBtn}`;
  }
  if (installEvent) return '<div class="muted">Install the app so you can check your points with one tap.</div><button class="btn yellow" data-install>Install app</button>';
  if (isIOS()) {
    if (/CriOS|FxiOS|EdgiOS|OPiOS|GSA\//i.test(UA)) return `<div class="muted">On iPhone, apps can only be added from <b>Safari</b>. Copy the link, open <b>Safari</b>, paste it, then tap <b>Share ⬆︎</b> → <b>Add to Home Screen</b>.</div>${copyBtn}`;
    return '<div class="muted">Tap the <b>Share</b> button <b>⬆︎</b> at the bottom of Safari, then <b>Add to Home Screen</b>, then <b>Add</b>.</div>';
  }
  if (/SamsungBrowser/i.test(UA)) return '<div class="muted">Tap the <b>☰</b> menu at the bottom, then <b>Add page to</b> → <b>Home screen</b>.</div>';
  if (isAndroid()) {
    const chrome = /Chrome\//.test(UA) && !/EdgA|OPR|Opera|MiuiBrowser|XiaoMi|UCBrowser|HeyTap|Vivo|OppoBrowser|HuaweiBrowser/i.test(UA);
    if (chrome) return '<div class="muted">Tap the <b>⋮</b> menu at the top right, then <b>Install app</b> or <b>Add to Home screen</b>.</div>';
    return `<div class="muted">For the best result use <b>Chrome</b>: copy the link, open <b>Chrome</b>, paste it, then tap <b>⋮</b> → <b>Install app</b>.<br>Or in this browser, open its menu and look for <b>Add to Home screen</b>.</div>${copyBtn}`;
  }
  return '';   // computer: nothing to show unless the browser offers to install
}
function installBox() {
  if (isStandalone()) return '';
  if (store.get('installed') && !installEvent && !inAppBrowser()) {
    return '<div class="panel install show"><div class="muted center">✅ EMEEG Points is installed on this phone. Open it from the <b>EMEEG Points</b> icon on your home screen.</div></div>';
  }
  const help = installHelp();
  if (!help) return '';
  return `<div class="panel install show"><h2>📲 Keep EMEEG Points on your phone</h2>${help}</div>`;
}
function updateInstallBox() {
  document.querySelectorAll('.install').forEach((old) => {
    const html = installBox();
    if (!html) { old.remove(); return; }
    const t = document.createElement('div'); t.innerHTML = html; old.replaceWith(t.firstElementChild);
  });
  if (!document.querySelector('.install') && installEvent && !isStandalone()) {
    const t = document.createElement('div'); t.innerHTML = installBox(); if (t.firstElementChild) $app.appendChild(t.firstElementChild);
  }
  bindInstall();
}
function bindInstall() {
  document.querySelectorAll('[data-install]').forEach((b) => { if (b._bound) return; b._bound = true; b.addEventListener('click', async () => {
    if (!installEvent) { updateInstallBox(); return; }
    installEvent.prompt();
    const choice = await installEvent.userChoice.catch(() => null);
    installEvent = null;
    if (choice && choice.outcome === 'accepted') store.set('installed', true);
    updateInstallBox();
  }); });
  document.querySelectorAll('[data-copylink]').forEach((b) => { if (b._bound) return; b._bound = true; b.addEventListener('click', async () => {
    const link = b.getAttribute('data-copylink');
    try { await navigator.clipboard.writeText(link); b.textContent = '✅ Link copied - paste it in ' + (isIOS() ? 'Safari' : 'Chrome'); }
    catch { prompt('Copy this link:', link); }
  }); });
}

// ---------------------------------------------------------------- start
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
if (!CFG.supabaseUrl || !CFG.supabaseKey) {
  $app.innerHTML = '<div class="panel"><h2>Not set up yet</h2><div class="muted">This app needs its settings (config.js). Ask the store to download the phone app files from the EMEEG Loyalty app.</div></div>';
} else {
  const login = store.get('login'), last = store.get('last');
  const qCard = new URLSearchParams(location.search).get('card');
  if (login && (!qCard || normCard(qCard) === login.card)) {
    if (last) showPoints(last.data, navigator.onLine ? false : last.at);
    else $app.innerHTML = '<div class="panel center muted">Loading your points…</div>';
    refresh(false).then(() => { if (!navigator.onLine && last) showPoints(last.data, last.at); });
  } else {
    showLogin('', qCard ? normCard(qCard) : '');
  }
  // keep it fresh while the app is open
  setInterval(() => { if (document.visibilityState === 'visible') refresh(false); }, 60000);
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') refresh(false); });
}
</script>
</body>
</html>
